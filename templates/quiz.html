<!DOCTYPE html>
<html>
<head>
    <title>Quiz Generator</title>
</head>
<body>

<h1>Quiz Generator</h1>

<form method="POST">

<p>{{ q }}</p>
{% endfor %}

<a href="/">Back</a>

</body>
</html>
